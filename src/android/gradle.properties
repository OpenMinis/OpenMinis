# Keep the build inside this phone's memory budget: the daemon claims 4g here
# while the Kotlin compile daemon claims its own, and Android LMK kills the
# whole foreground process group mid-build. 1536m for the Kotlin daemon turned
# out too small: IR lowering dies with GC-overhead OOM on this codebase, so it
# gets 2048m while workers drop to 1 to keep the combined peak flat.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# First-build Maven/Gradle mirrors. auto|cn|off — see scripts/pick_build_mirrors.py
# and the built-in android-sdk-mirrors skill. Do not pin a single mirror URL.
# MINIS_BUILD_MIRRORS=auto
