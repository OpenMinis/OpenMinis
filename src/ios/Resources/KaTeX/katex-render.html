<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<script src="mhchem.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    -webkit-text-size-adjust: none;
    overflow: hidden;
  }
  #math {
    display: inline-block;
    padding: 2px 4px;
    color: #000;
  }

  /* [T-ios-latex-tag-overlap] Equation numbers (\tag, \tag*, and the
     auto-numbering of \begin{align}) render as
     `.katex-html > .tag { position: absolute; right: 0 }` — see katex.min.css.
     `right: 0` resolves against the containing block, and #math is
     `inline-block`, i.e. shrink-to-fit: the container collapses to the width
     of the formula itself, so "the right edge" IS the end of the formula and
     the number is painted directly on top of it. Measured in WebKit on
     `E = mc^2 \tag{1}`: tag box at x=49..73 while the body ran to x=73 — 24px
     of overlap, which is the reported "E = m(1)c²" mash-up. \tag* overlapped
     by 10px and a two-line align by 26px.

     Giving the row a real width fixes it without touching KaTeX: min-width
     stops the collapse so `right: 0` has somewhere to go, and the
     padding-right reserves a gutter for the number to sit in. Scoped to
     `.has-tag`, set by renderMath() only when a tag is actually present, so
     every untagged formula keeps its existing shrink-to-fit geometry and its
     cached bitmap size is unchanged.

     A class rather than `:has()`: `:has()` needs a recent WebKit, and this
     must behave identically on the older iOS versions the app still targets.

     Mirrors the Android fix (1a52d6e59) — both platforms ship this same file. */
  #math.has-tag .katex-display > .katex > .katex-html {
    min-width: 100%;
    padding-right: 3.5em;
  }
</style>
</head>
<body>
<span id="math"></span>
<script>
function renderMath(latex, displayMode, fontSize) {
  try {
    // Use KaTeX's renderToString to get the HTML directly, avoiding WKWebView
    // snapshot issues (alpha=0 views produce blank snapshots on iOS 16+).
    var html = katex.renderToString(latex, {
      displayMode: displayMode,
      throwOnError: false,
      strict: false,
      trust: true,
      output: 'html'
    });
    // Render into the DOM to measure size.
    var el = document.getElementById('math');
    el.style.fontSize = fontSize + 'px';
    el.innerHTML = html;
    // [T-ios-latex-tag-overlap] Flag rows that carry an equation number so the
    // CSS above can reserve a gutter for it. Done here rather than with a
    // `:has()` selector for WebKit-version independence (see the stylesheet).
    //
    // Set BEFORE the measurement below, and it matters more here than on
    // Android: this width is used twice — getBoundingClientRect() reports it,
    // and KaTeXRenderer then resizes the WKWebView to exactly that size and
    // crops takeSnapshot() to it. Measuring first would bake the pre-fix,
    // narrower box into both, cropping the number straight back off the bitmap.
    el.classList.toggle('has-tag', !!el.querySelector('.katex-html > .tag'));
    document.fonts.ready.then(function() {
      var rect = el.getBoundingClientRect();
      if (rect.width < 3 || rect.height < 3) {
        window.webkit.messageHandlers.mathRendered.postMessage({
          width: 0, height: 0,
          error: 'rendered content is empty (unsupported LaTeX?)'
        });
        return;
      }
      // Send the HTML string back to native for rendering via NSAttributedString
      // or a dedicated image renderer, along with the measured size.
      window.webkit.messageHandlers.mathRendered.postMessage({
        width: Math.ceil(rect.width),
        height: Math.ceil(rect.height),
        html: html,
        error: null
      });
    });
  } catch (e) {
    window.webkit.messageHandlers.mathRendered.postMessage({
      width: 0,
      height: 0,
      error: e.message
    });
  }
}
</script>
</body>
</html>
