name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.swift'
      - '**/*.m'
      - '**/*.mm'
      - '**/*.h'
      - '**/*.xcodeproj/**'
      - '**/*.xcworkspace/**'
      - '.github/workflows/build-ios-ipa.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.swift'
      - '**/*.m'
      - '**/*.mm'
      - '**/*.h'
      - '**/*.xcodeproj/**'
      - '**/*.xcworkspace/**'

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 120

    env:
      SCHEME: Minis
      CONFIGURATION: Release
      PROJECT: src/ios/Minis.xcodeproj
      ARCHIVE_PATH: ${{ github.workspace }}/build/Minis.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      EXPORT_OPTIONS_PLIST: ${{ github.workspace }}/build/ExportOptions.plist

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install native build dependencies
        run: |
          brew install ninja llvm libarchive pkg-config meson

      - name: Prepare provider customization config
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      # Native dependencies are built from source and are NOT committed.
      # Order matters: FFmpeg links against LAME.
      - name: Build LAME
        run: ./deps/build_lame.sh

      - name: Build FFmpeg frameworks
        run: ./deps/build_ffmpeg.sh

      - name: Build iSH libraries
        run: ./deps/build_ish.sh

      - name: Prepare Alpine rootfs
        run: ./deps/prepare_alpine_rootfs.sh

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Install signing certificate
        if: github.event_name != 'pull_request'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD || 'temp_keychain_password' }}
        run: |
          if [ -z "$IOS_P12_BASE64" ] || [ -z "$IOS_P12_PASSWORD" ]; then
            echo "Signing certificate secrets not available, skipping..."
            exit 0
          fi
          echo "$IOS_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f cert.p12

      - name: Install provisioning profile
        if: github.event_name != 'pull_request'
        env:
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          if [ -z "$IOS_MOBILEPROVISION_BASE64" ]; then
            echo "Provisioning profile secret not available, skipping..."
            exit 0
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/OpenMinis.mobileprovision"

      - name: Derive development team ID from provisioning profile
        id: team
        if: github.event_name != 'pull_request'
        run: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/OpenMinis.mobileprovision"
          if [ ! -f "$PROFILE_PATH" ]; then
            echo "team_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TEAM_ID="$(security cms -D -i "$PROFILE_PATH" \
            | plutil -extract TeamIdentifier.0 raw -o - -)"
          echo "team_id=${TEAM_ID}" >> "$GITHUB_OUTPUT"
          echo "Derived team ID: ${TEAM_ID}"

      - name: Create ExportOptions.plist
        run: |
          mkdir -p "$(dirname "$EXPORT_OPTIONS_PLIST")"
          cat > "$EXPORT_OPTIONS_PLIST" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Archive app
        run: |
          if [ -n "$TEAM_ID" ]; then
            SIGNING_ARGS="CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=${TEAM_ID}"
          else
            # No signing assets provided: build an unsigned archive and package
            # it into an unsigned IPA later (not installable on stock devices).
            SIGNING_ARGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"
          fi
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            clean archive $SIGNING_ARGS
        env:
          TEAM_ID: ${{ steps.team.outputs.team_id }}

      - name: Export signed IPA
        id: export_ipa
        if: ${{ steps.team.outputs.team_id != '' }}
        run: |
          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"

      - name: Package unsigned IPA
        if: ${{ steps.team.outputs.team_id == '' }}
        run: |
          mkdir -p "$EXPORT_PATH/Payload"
          cp -R "$ARCHIVE_PATH/Products/Applications/"*.app "$EXPORT_PATH/Payload/"
          cd "$EXPORT_PATH"
          zip -qry "OpenMinis-unsigned.ipa" Payload
          ls -lh "OpenMinis-unsigned.ipa"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcarchive
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error
