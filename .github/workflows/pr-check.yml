name: PR Checks

# Regression gate for every pull request. Modeled on cuplivo's pr-check.yml
# (format + l10n + analyze + test on each PR), adapted to this repo:
#   * compileReleaseKotlin — type-checks main sources (fast fail before tests)
#   * testReleaseUnitTest — the full JVM suite (only variant; debug is
#     disabled via androidComponents, see app/build.gradle.kts)
#   * check_new_untranslated.py — rejects PRs that add a user-visible
#     string without translating it into every shipped locale.
# The heavy assemble/NDK/sandbox-assets path stays in android-apk.yml; this
# workflow deliberately avoids it so PR feedback stays under ~20 minutes.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "35.0.0"
  # Build number of the command-line tools zip: was inline in the download URL,
  # exposed so the SDK cache key invalidates when it changes.
  ANDROID_CMDLINE_TOOLS: "11076708"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

jobs:
  checks:
    name: Compile / Unit tests / L10n gate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the l10n diff against the PR base works.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Restore Android SDK cache
        uses: actions/cache@v4
        with:
          # setup-java's `cache: gradle` only covers ~/.gradle — the platform and
          # build-tools were re-downloaded on every PR. Key names both pinned
          # versions plus the command-line tools build, so a toolchain bump in
          # `env` misses instead of restoring an outdated SDK.
          # sdkmanager below stays unconditional: against restored packages it
          # reads package.xml and no-ops, so nothing about the installed
          # toolchain changes.
          path: |
            /usr/local/lib/android/sdk/cmdline-tools
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/licenses
          key: prcheck-android-sdk-${{ runner.os }}-platform-${{ env.ANDROID_PLATFORM }}-bt-${{ env.ANDROID_BUILD_TOOLS }}-cmdline-${{ env.ANDROID_CMDLINE_TOOLS }}
          restore-keys: |
            prcheck-android-sdk-${{ runner.os }}-platform-${{ env.ANDROID_PLATFORM }}-bt-${{ env.ANDROID_BUILD_TOOLS }}-
            prcheck-android-sdk-${{ runner.os }}-platform-${{ env.ANDROID_PLATFORM }}-

      - name: Install Android SDK
        run: |
          set -e
          mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          # sudo dropped deliberately: the cached dirs must stay owned by the
          # runner user or actions/cache cannot extract into them on a hit, and
          # android-apk.yml already writes to this exact path unprivileged.
          if [ ! -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ]; then
            curl -fsSL -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-${{ env.ANDROID_CMDLINE_TOOLS }}_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/sdk
            mv /tmp/sdk/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
          fi
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Compile Kotlin (release variant)
        working-directory: src/android
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          # Phone-tuned gradle.properties leaks into CI: 2g Kotlin daemon OOMs
          # on cold compile, workers.max=1 neuters --parallel. See android-apk.yml.
          sed -i 's|org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8|' gradle.properties
          sed -i 's|kotlin.daemon.jvmargs=.*|kotlin.daemon.jvmargs=-Xmx4g|' gradle.properties
          sed -i 's|org.gradle.workers.max=.*|org.gradle.workers.max=4|' gradle.properties
          chmod +x gradlew
          ./gradlew :app:compileReleaseKotlin --parallel --stacktrace

      - name: Unit tests (release variant)
        working-directory: src/android
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew :app:testReleaseUnitTest --parallel --stacktrace

      - name: No new untranslated strings
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/ci/check_new_untranslated.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}"

      # [T-ui-cjk-ratchet] The l10n gate only sees strings.xml. Freeze the
      # existing hardcoded Chinese literals in ui/ and reject any new/growing
      # file (25 files / 100 literals at adoption).
      - name: No new hardcoded CJK in UI
        run: python3 scripts/ci/check_cjk_literals.py

      # [T-arch-ratchet] UI review report P2-2: oversized files are on a
      # one-way diet. Baseline ceilings never rise; new files cap at 800
      # lines. Runs on every event (tree state, not diff state).
      - name: Architecture policy ratchet
        run: python3 scripts/ci/check_architecture_policy.py
